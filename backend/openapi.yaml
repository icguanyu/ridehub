openapi: 3.0.3
info:
  title: RideHub API
  version: 1.0.0
  description: |
    司機接駁服務預約系統 MVP。

    - 司機以「手機 + 密碼」登入（帳密存於 Supabase Auth），取得後端簽發的 JWT。
    - 需登入的端點帶 `Authorization: Bearer <token>`，且只能操作自己的 `driverId`。
    - 客人為匿名：以司機的 `driverId` 建立預約，取得 `statusToken` 後憑此查詢狀態。
    - 所有「今天 / 現在」判斷以環境變數 `APP_TIMEZONE`（預設 `Asia/Taipei`）為準。
    - 全站有流量限制（預設 1000 次 / 15 分 / IP），另有手機查詢、登入、建立預約的加強限制；超過回 `429`。
    - 客人不收推播通知，一律於狀態頁 / 手機查詢查看；LINE 通知僅發給司機。
servers:
  - url: https://ridehub-api-239173126142.asia-east1.run.app/api/v1
    description: Production (Cloud Run)
  - url: http://localhost:3000/api/v1
    description: 本機開發

tags:
  - name: Health
  - name: Auth
  - name: Driver
  - name: Booking
  - name: Line
  - name: Misc
  - name: Admin

security: []

paths:
  /health:
    get:
      tags: [Health]
      summary: 存活檢查
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  service: { type: string, example: ridehub-backend }
                  env: { type: string, example: production }
                  time: { type: string, format: date-time }

  /health/db:
    get:
      tags: [Health]
      summary: 檢查 Supabase 連線
      responses:
        '200':
          description: 連線正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  db: { type: string, example: connected }
        '503':
          description: 連線失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: false }
                  db: { type: string, example: error }
                  message: { type: string }

  /fuel-prices:
    get:
      tags: [Misc]
      summary: 台灣參考油價（NT$/L）
      description: 優先抓中油 OpenData，失敗回退預設值。前端用於顯示與能耗試算預填。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices:
                    type: object
                    additionalProperties: { type: number }
                    example: { gasoline_92: 29.9, gasoline_95: 31.4, gasoline_98: 33.4, diesel: 27.9 }
                  source: { type: string, enum: [live, cache, fallback] }
                  updatedAt: { type: string, format: date-time }

  /drivers/auth/register:
    post:
      tags: [Auth]
      summary: 司機註冊
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, email, password]
              properties:
                name: { type: string, maxLength: 100, example: 王小明 }
                phone: { type: string, pattern: '^09\d{8}$', example: '0912345678' }
                email: { type: string, format: email, example: ming@example.com }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '201':
          description: 註冊成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver: { $ref: '#/components/schemas/DriverSummary' }
                  token: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 手機或 email 已註冊
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /drivers/auth/login:
    post:
      tags: [Auth]
      summary: 司機登入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string, pattern: '^09\d{8}$' }
                password: { type: string }
      responses:
        '200':
          description: 登入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  driver: { $ref: '#/components/schemas/DriverPrivate' }
                  token: { type: string, description: 後端簽發的 API JWT }
                  supabase:
                    type: object
                    description: Supabase session（供前端日後直連 Realtime）
                    properties:
                      accessToken: { type: string }
                      refreshToken: { type: string }
                      expiresAt: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 手機或密碼錯誤
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /drivers/{driverId}/public:
    get:
      tags: [Driver]
      summary: 司機公開資訊（客人端用，免登入）
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverPublic' }
        '404': { $ref: '#/components/responses/NotFound' }

  /drivers/{driverId}:
    get:
      tags: [Driver]
      summary: 取得司機完整資料（本人）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverPrivate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Driver]
      summary: 編輯服務資訊（本人）
      description: 僅接受下列白名單欄位，傳入其他欄位會回 400。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 100 }
                serviceDescription: { type: string, maxLength: 2000, nullable: true }
                serviceAreas: { type: string, maxLength: 500, nullable: true, example: '新竹市,竹科園區' }
                carType: { type: string, maxLength: 50, nullable: true }
                carPlate: { type: string, maxLength: 20, nullable: true }
                lineDisplayId:
                  type: string
                  maxLength: 100
                  nullable: true
                  description: 對外顯示的 LINE ID（客人加好友用），與 bind-line 的內部 line_id 不同
                maxPassengers: { type: integer, minimum: 1, maximum: 20, description: 可載客人數上限 }
                passengerInsuranceWan:
                  type: integer
                  minimum: 0
                  maximum: 99999
                  nullable: true
                  description: 乘客責任險保額（萬元）；未填 = 未提供
                energyType:
                  type: string
                  enum: [gasoline_92, gasoline_95, gasoline_98, diesel, ev]
                  nullable: true
                energyConsumption:
                  type: number
                  nullable: true
                  description: 油車 km/L；電車 kWh/100km
                energyUnitPrice:
                  type: number
                  nullable: true
                  description: 油車 NT$/L（留空用即時油價）；電車 NT$/度
                basePrice: { type: number, minimum: 0, nullable: true }
                pricePerKm: { type: number, minimum: 0, nullable: true }
      responses:
        '200':
          description: 更新後的資料
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverPrivate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /drivers/{driverId}/bind-line:
    post:
      tags: [Driver]
      summary: 綁定 LINE User ID（本人）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineId]
              properties:
                lineId: { type: string, maxLength: 100, example: U1234567890abcdef1234567890abcdef }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /drivers/{driverId}/line/link-code:
    post:
      tags: [Driver]
      summary: 產生 LINE 綁定碼（本人）
      description: |
        回傳一組 6 碼、30 分鐘有效的綁定碼。司機加官方帳號好友後把此碼傳給它，
        webhook 收到即把該司機的 line_id 綁定。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: 'A7K9QP' }
                  expiresAt: { type: string, format: date-time }
                  ttlMinutes: { type: integer, example: 30 }
                  addFriendUrl: { type: string, nullable: true }
                  instructions: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /drivers/{driverId}/availability:
    get:
      tags: [Driver]
      summary: 取得每日名額設定與今日已用量（本人）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Driver]
      summary: 更新每日名額上限（本人）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                maxDailyBookings: { type: integer, minimum: 1, maximum: 100, example: 10 }
      responses:
        '200':
          description: 更新後的設定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /drivers/{driverId}/bookings:
    get:
      tags: [Driver]
      summary: 司機的預約列表（本人）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, quoted, accepted, rejected, completed, cancelled]
        - name: month
          in: query
          description: YYYY-MM
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items: { $ref: '#/components/schemas/BookingItem' }
                  pagination:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Driver]
      summary: 司機在後台自建訂單
      description: >
        客人已談好、不想自己上平台輸入時，由司機代填。建立後直接為 `accepted`，
        不做每日名額檢查（但仍檢查人數上限、日期不可為過去）。
        `agreedPrice` 未填則沿用估價；`estimatedDistanceKm` 未填會嘗試自動估算。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [customerName, customerPhone, pickupLocation, destination, bookingDate, bookingTime]
              properties:
                customerName: { type: string }
                customerPhone: { type: string, example: '0912345678' }
                customerLineId: { type: string, maxLength: 100 }
                tripType: { type: string, enum: [one_way, round_trip], default: one_way }
                pickupLocation: { type: string, maxLength: 200 }
                destination: { type: string, maxLength: 200 }
                bookingDate: { type: string, format: date }
                bookingTime: { type: string, example: '14:00' }
                returnDate: { type: string, format: date, nullable: true }
                returnTime: { type: string, nullable: true, example: '18:00' }
                passengerCount: { type: integer, minimum: 1, maximum: 20, default: 1 }
                specialRequests: { type: string, maxLength: 2000 }
                estimatedDistanceKm: { type: number, minimum: 0, maximum: 2000 }
                agreedPrice: { type: number, minimum: 0, description: 議定車資；未填則沿用估價 }
      responses:
        '201':
          description: 訂單已建立（accepted）
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: '#/components/schemas/BookingItem' }
                  statusToken:
                    type: string
                    description: 可組成客人查詢狀態的連結
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /drivers/{driverId}/distance:
    post:
      tags: [Driver]
      summary: 依上車/目的地文字自動估算開車距離
      description: 用 Google Distance Matrix。未設 API key 或查不到 → distanceKm 為 null。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [origin, destination]
              properties:
                origin: { type: string, maxLength: 200 }
                destination: { type: string, maxLength: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  distanceKm: { type: number, nullable: true }
                  durationMin: { type: integer, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /drivers/{driverId}/stats:
    get:
      tags: [Driver]
      summary: 月統計（本人）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
        - name: month
          in: query
          description: YYYY-MM，預設當月
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /bookings:
    post:
      tags: [Booking]
      summary: 客人建立預約（匿名）
      description: |
        會驗證司機存在、日期不可早於今天（以 APP_TIMEZONE 為準）、人數不超過司機上限、
        當日名額未滿，計算預估車資後建立 `pending` 預約，並以 LINE 嘗試通知司機。
        `tripType=round_trip` 時 `returnDate` / `returnTime` 必填，回程可跨日，
        且去程日與回程日各佔一個名額。
        `estimatedDistanceKm` 留空且已設 GOOGLE_MAPS_API_KEY 時，會依上車/目的地自動估算距離。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [driverId, customerName, customerPhone, pickupLocation, destination, bookingDate, bookingTime]
              properties:
                driverId: { type: string, format: uuid }
                customerName: { type: string, maxLength: 100 }
                customerPhone: { type: string, pattern: '^09\d{8}$' }
                customerLineId: { type: string, maxLength: 100 }
                tripType:
                  type: string
                  enum: [one_way, round_trip]
                  default: one_way
                pickupLocation: { type: string, maxLength: 200 }
                destination: { type: string, maxLength: 200 }
                bookingDate: { type: string, format: date, example: '2026-09-01' }
                bookingTime: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '14:00' }
                returnDate:
                  type: string
                  format: date
                  description: 往返必填；不可早於 bookingDate
                returnTime:
                  type: string
                  pattern: '^([01]\d|2[0-3]):[0-5]\d$'
                  description: 往返必填；同日時需晚於 bookingTime
                passengerCount: { type: integer, minimum: 1, maximum: 20, default: 1 }
                specialRequests: { type: string, maxLength: 2000 }
                estimatedDistanceKm:
                  type: number
                  minimum: 0
                  maximum: 2000
                  description: >
                    選填；留空會嘗試自動估算。車資 = (base_price + price_per_km × 距離)，往返再 ×2
      responses:
        '201':
          description: 預約已建立
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, example: pending }
                      tripType: { type: string, enum: [one_way, round_trip] }
                      estimatedPrice: { type: number, example: 450 }
                      statusToken:
                        type: string
                        description: 查詢預約狀態、回應報價用的憑證
                      message: { type: string }
                  notified:
                    oneOf:
                      - { type: string, enum: [line] }
                      - { type: boolean, enum: [false] }
                    description: 成功通知司機的管道（LINE）；未設定或失敗時為 false
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: 找不到司機
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 該日預約已額滿
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/search:
    get:
      tags: [Booking]
      summary: 乘客用手機號碼查詢自己的行程（公開）
      description: 回傳精簡欄位（不含敏感聯絡資訊），每筆附可查看完整狀態的 `statusToken`。已軟刪的不列出。
      parameters:
        - name: phone
          in: query
          required: true
          schema: { type: string, pattern: '^09\d{8}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items: { $ref: '#/components/schemas/BookingSearchItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: 查詢過於頻繁
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/{bookingId}:
    get:
      tags: [Booking]
      summary: 客人查詢預約狀態
      description: >
        需帶建立預約時取得的 `statusToken`。僅 `accepted` 且未被刪除時才回傳司機聯絡方式；
        司機已移除此預約時 `deletedAt` 有值。
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: '#/components/schemas/BookingWithDriver' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: token 無效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Booking]
      summary: 司機刪除行程（軟刪）
      description: >
        僅該預約的司機可刪，且去程日期時間尚未開始。刪除後行程不再出現於任何列表、
        統計與乘客查詢，但資料列保留供日後統計。已刪除者再次刪除回 409。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        '400':
          description: 行程已開始或已結束，無法刪除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 行程已被刪除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/{bookingId}/accept:
    put:
      tags: [Booking]
      summary: 司機接受預約
      description: 僅該預約的司機、且狀態為 `pending` 時可操作。客人自行於狀態頁查看，不另發通知。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: '#/components/schemas/BookingItem' }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 預約非 pending 狀態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/{bookingId}/reject:
    put:
      tags: [Booking]
      summary: 司機拒絕預約
      description: 僅該預約的司機、且狀態為 `pending` 時可操作。客人自行於狀態頁查看，不另發通知。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500, example: 該時段已有預約 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: '#/components/schemas/BookingItem' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 預約非 pending 狀態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/{bookingId}/quote:
    put:
      tags: [Booking]
      summary: 司機重新報價
      description: 僅該預約的司機、且狀態為 `pending` 時可操作。`pending` → `quoted`；客人於狀態頁查看報價，不另發通知。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [price]
              properties:
                price: { type: number, minimum: 0, exclusiveMinimum: true, example: 800 }
                note: { type: string, maxLength: 500, example: 往返含等候一小時 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: '#/components/schemas/BookingItem' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 預約非 pending 狀態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/{bookingId}/quote/accept:
    put:
      tags: [Booking]
      summary: 客人同意司機報價
      description: 需帶 `statusToken`。`quoted` → `accepted`，成交價為司機報價，並通知司機。
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: '#/components/schemas/BookingWithDriver' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: token 無效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 目前沒有待確認的報價
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/{bookingId}/quote/decline:
    put:
      tags: [Booking]
      summary: 客人不同意司機報價
      description: 需帶 `statusToken`。`quoted` → `cancelled`，並通知司機。
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: '#/components/schemas/BookingWithDriver' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403':
          description: token 無效
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 目前沒有待確認的報價
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/{bookingId}/cancel:
    put:
      tags: [Booking]
      summary: 司機取消預約
      description: 僅該預約的司機、且狀態為 `pending` / `quoted` / `accepted` 時可操作。取消理由必填；客人於狀態頁查看，不另發通知。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500, example: 司機臨時有事無法出車 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: '#/components/schemas/BookingItem' }
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 預約目前狀態無法取消
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/{bookingId}/complete:
    put:
      tags: [Booking]
      summary: 司機標記行程完成
      description: 僅該預約的司機、且狀態為 `accepted` 時可操作。`accepted` → `completed`，完成後無法復原。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking: { $ref: '#/components/schemas/BookingItem' }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 預約非 accepted 狀態
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/auth/login:
    post:
      tags: [Admin]
      summary: superadmin 登入
      description: email 需在 ADMIN_EMAILS 且為 Supabase Auth 既有帳號。回 12 小時的 admin token。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  email: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/overview:
    get:
      tags: [Admin]
      summary: 平台總覽（本月）
      description: 司機數、本月活躍司機、本月預約數與依狀態分佈、GMV（成交價總和）。
      security: [{ bearerAuth: [] }]
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/drivers:
    get:
      tags: [Admin]
      summary: 司機列表（含預約數、最後預約日、驗證/停權狀態）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: 比對 name / phone / email
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/drivers/{driverId}:
    get:
      tags: [Admin]
      summary: 單一司機（profile + 本月統計 + 近 20 筆預約）
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/drivers/{driverId}/verify:
    put:
      tags: [Admin]
      summary: 設定司機已驗證
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verified]
              properties: { verified: { type: boolean } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/drivers/{driverId}/suspend:
    put:
      tags: [Admin]
      summary: 停權 / 解除停權司機
      description: 停權後該司機無法登入、公開頁回 404、無法再被客人預約。
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/bookings:
    get:
      tags: [Admin]
      summary: 全站預約（跨司機，可篩狀態 / 司機 / 月份）
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, quoted, accepted, rejected, completed, cancelled] }
        - name: driverId
          in: query
          schema: { type: string, format: uuid }
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /line/webhook:
    post:
      tags: [Line]
      summary: LINE Messaging API webhook（供 LINE 平台呼叫）
      description: |
        非供前端使用。以 `x-line-signature`（HMAC-SHA256 + channel secret）驗證，
        驗證失敗回 401，其餘一律回 200。目前處理：
        - `follow`：回覆歡迎與綁定說明
        - `message`（text）：把內容當綁定碼比對，成功則綁定司機並回覆確認
      responses:
        '200': { description: 已接收（LINE 平台驗證亦回此） }
        '401': { description: 簽章驗證失敗 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登入 `/drivers/auth/login` 取得的 `token`

  parameters:
    DriverId:
      name: driverId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: 欄位驗證失敗
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 未授權（缺 token 或 token 無效）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 沒有權限（非本人 / 非該預約司機）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 找不到資源
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            details:
              type: object
              additionalProperties: true
              description: 欄位驗證錯誤時的細節（key 為欄位名）
            stack: { type: string, description: 僅開發環境回傳 }

    DriverSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }

    DriverPrivate:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: string, nullable: true }
        lineId: { type: string, nullable: true }
        serviceDescription: { type: string, nullable: true }
        serviceAreas: { type: string, nullable: true }
        carType: { type: string, nullable: true }
        carPlate: { type: string, nullable: true }
        lineDisplayId: { type: string, nullable: true, description: 對外顯示的 LINE ID（客人加好友用） }
        basePrice: { type: number, nullable: true }
        pricePerKm: { type: number, nullable: true }
        maxDailyBookings: { type: integer }
        maxPassengers: { type: integer, description: 可載客人數上限 }
        passengerInsuranceWan: { type: integer, nullable: true, description: 乘客責任險保額（萬元） }
        energyType: { type: string, nullable: true, enum: [gasoline_92, gasoline_95, gasoline_98, diesel, ev] }
        energyConsumption: { type: number, nullable: true, description: 油車 km/L；電車 kWh/100km }
        energyUnitPrice: { type: number, nullable: true, description: 油車 NT$/L；電車 NT$/度 }
        isVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DriverPublic:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        serviceDescription: { type: string, nullable: true }
        serviceAreas: { type: string, nullable: true }
        carType: { type: string, nullable: true }
        carPlate: { type: string, nullable: true }
        basePrice: { type: number, nullable: true }
        pricePerKm: { type: number, nullable: true }
        maxPassengers: { type: integer, description: 可載客人數上限 }
        passengerInsuranceWan: { type: integer, nullable: true, description: 乘客責任險保額（萬元） }
        isVerified: { type: boolean }

    Availability:
      type: object
      properties:
        maxDailyBookings: { type: integer, example: 10 }
        bookedTodayCount: { type: integer, description: 今日已佔用名額的預約數（以 APP_TIMEZONE 為準） }

    Stats:
      type: object
      properties:
        month: { type: string, example: '2026-08' }
        totalBookings: { type: integer }
        acceptedBookings: { type: integer }
        totalCustomers: { type: integer, description: 不重複客人數 }
        totalRevenue: { type: number }
        avgRating: { type: number, example: 4.7 }

    BookingItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        customerName: { type: string }
        customerPhone: { type: string }
        customerLineId: { type: string, nullable: true }
        tripType: { type: string, enum: [one_way, round_trip] }
        pickupLocation: { type: string }
        destination: { type: string }
        bookingDate: { type: string, format: date }
        bookingTime: { type: string, example: '14:00' }
        returnDate: { type: string, format: date, nullable: true, description: 往返才有 }
        returnTime: { type: string, nullable: true, example: '18:00' }
        passengerCount: { type: integer }
        specialRequests: { type: string, nullable: true }
        estimatedPrice: { type: number, nullable: true, description: 建立時的基礎報價 }
        estimatedDistanceKm: { type: number, nullable: true, description: 手填或 Google 自動估算 }
        estimatedDurationMin: { type: integer, nullable: true, description: Google 估的車程分鐘 }
        estimatedEnergyCost: { type: number, nullable: true, description: 建立時快照的能耗成本估算（僅供參考） }
        quotedPrice: { type: number, nullable: true, description: 司機重新報價的金額 }
        quotedAt: { type: string, format: date-time, nullable: true }
        quoteNote: { type: string, nullable: true }
        agreedPrice:
          type: number
          nullable: true
          description: 成交價 = quotedPrice ?? estimatedPrice
        status:
          type: string
          enum: [pending, quoted, accepted, rejected, completed, cancelled]
        rejectedReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    BookingWithDriver:
      type: object
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, quoted, accepted, rejected, completed, cancelled]
        tripType: { type: string, enum: [one_way, round_trip] }
        customerName: { type: string }
        customerPhone: { type: string }
        pickupLocation: { type: string }
        destination: { type: string }
        bookingDate: { type: string, format: date }
        bookingTime: { type: string }
        returnDate: { type: string, format: date, nullable: true }
        returnTime: { type: string, nullable: true }
        passengerCount: { type: integer }
        specialRequests: { type: string, nullable: true }
        estimatedPrice: { type: number, nullable: true }
        quotedPrice: { type: number, nullable: true }
        quoteNote: { type: string, nullable: true }
        quotedAt: { type: string, format: date-time, nullable: true }
        agreedPrice: { type: number, nullable: true }
        rejectedReason: { type: string, nullable: true }
        driverName: { type: string, nullable: true }
        driverPhone:
          type: string
          nullable: true
          description: 僅 status = accepted 且未刪除時提供
        driverLineDisplayId:
          type: string
          nullable: true
          description: 僅 status = accepted 且未刪除時提供；對外顯示的 LINE ID
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: 有值代表司機已移除此預約；此時不提供司機聯絡方式
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BookingSearchItem:
      type: object
      description: 手機查詢結果的精簡列
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [pending, quoted, accepted, rejected, completed, cancelled]
        tripType: { type: string, enum: [one_way, round_trip] }
        pickupLocation: { type: string }
        destination: { type: string }
        bookingDate: { type: string, format: date }
        bookingTime: { type: string, nullable: true }
        returnDate: { type: string, format: date, nullable: true }
        returnTime: { type: string, nullable: true }
        driverName: { type: string, nullable: true }
        statusToken: { type: string, description: 查看完整狀態用 }
